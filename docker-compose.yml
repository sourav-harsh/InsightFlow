version: "3.9"

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      AUTH_SERVICE_URL: http://auth-service:9020

    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - insight-network
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: auth-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_REDIS_HOST: redis

      SPRING_RABBITMQ_HOST: rabbitmq

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9020/auth/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - insight-network

  dataset-service:
    build:
      context: ./dataset-service
      dockerfile: Dockerfile

    container_name: dataset-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dataset_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      STORAGE_PATH: /app/uploads

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      zipkin:
        condition: service_started

    restart: unless-stopped

    networks:
      - insight-network

  analytics-worker:
    build:
      context: ./analytics-worker
      dockerfile: Dockerfile

    container_name: analytics-worker

    volumes:
      - uploads_data:/app/uploads

    environment:
      DATASET_DB_URL: jdbc:postgresql://postgres:5432/dataset_db
      DATASET_DB_USERNAME: postgres
      DATASET_DB_PASSWORD: postgres

      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      ANALYTICS_DB_USERNAME: postgres
      ANALYTICS_DB_PASSWORD: postgres

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    depends_on:
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started

      rabbitmq:
        condition: service_started

    restart: unless-stopped

    networks:
      - insight-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile


    container_name: analytics-service

    ports:
      - "8004:8004"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - insight-network

  client:
    build: ./client
    container_name: client
    ports:
      - "5170:3000"
    networks:
      - insight-network
    depends_on:
      - api-gateway
      - dataset-service
      - analytics-service
      - auth-service
    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d insightflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - insight-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    restart: unless-stopped

    networks:
      - insight-network

  redis:
    image: redis:8-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - insight-network

  zipkin:
    image: ghcr.io/openzipkin/zipkin-slim:${TAG:-latest}

    container_name: zipkin

    environment:
      STORAGE_TYPE: mem

    ports:
      - "9411:9411"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

    networks:
      - insight-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - insight-network

  logstash:
    image: docker.elastic.co/logstash/logstash:9.1.3
    container_name: logstash

    ports:
      - "5044:5044"

    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro

    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - insight-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.3
    container_name: kibana

    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - insight-network


volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  dataset-uploads:
  uploads_data:
  elasticsearch-data:

networks:

  insight-network:
    driver: bridge
