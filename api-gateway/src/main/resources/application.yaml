server.port: 8080
jwt:
  secretKey: your-secret-key

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:9020}
          predicates:
            - Path=/api/v1/auth/**
