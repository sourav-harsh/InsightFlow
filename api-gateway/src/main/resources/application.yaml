server.port: 8080
jwt:
  secretKey: your-secret-key

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:9020
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: gateway,health
