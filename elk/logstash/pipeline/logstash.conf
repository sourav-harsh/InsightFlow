input {
    tcp {
        port => 5000

        codec => json {
            target => "log"
        }
    }
}

filter {
    if [log][@timestamp] {
        date {
            match => ["[log][@timestamp]", "ISO8601"]
            target => "@timestamp"
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "insightflow-logs-%{+YYYY.MM.dd}"
    }

    stdout {
        codec => rubydebug
    }
}
