server:
  port: 9020

server.servlet.context-path: /auth
jwt.secretKey: your-secret-key

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/authDB
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
